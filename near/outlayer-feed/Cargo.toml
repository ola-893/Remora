[package]
name = "remora-feed"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
outlayer = "=0.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
wasi-http-client = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
