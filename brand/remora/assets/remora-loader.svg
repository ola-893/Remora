<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Cybernetic shark with a remora">
  <style>
    .swimmers { animation: swim 2.4s ease-in-out infinite; }
    .remora { animation: follow 2.4s ease-in-out infinite; }
    @keyframes swim { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(8px, -10px); } }
    @keyframes follow { 0%, 100% { transform: translate(0, 0); } 36% { transform: translate(-9px, 7px); } 71% { transform: translate(3px, -4px); } }
    @media (prefers-reduced-motion: reduce) { .swimmers, .remora { animation: none; } }
  </style>
